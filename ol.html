<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>

    <input id="name" type="text" placeholder="Enter Your Name">
    <input id="age" type="text" placeholder="Enter Your Age">

    <button id="btn">Login Here</button>

    <div id="result"></div>


    <script>

        // HTML ke elements ko pakad rahe hain
        const nameInput = document.getElementById("name");
        const ageInput = document.getElementById("age");
        const btn = document.getElementById("btn");
        const result = document.getElementById("result");


        // Login button par click hone ka wait
        btn.addEventListener("click", function() {

            // Input se value nikal rahe hain
            const userName = nameInput.value;
            const userAge = Number(ageInput.value);


            // Function call
            loginUser(userName, userAge);

        });


        // Login ka function
        function loginUser(name, age) {

            result.innerHTML = `
                Login Successful! <br>
                Welcome ${name} <br>
                Your Age is ${age}
            `;

        }

    </script>

</body>
</html>
